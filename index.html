<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eden Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
          background: rgba(255, 255, 255, 0.7);
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.3);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        /* ── Dark mode (centralized remap; toggled by the `dark` class on <html>) ── */
        .dark body { background-color: #0f172a; color: #e2e8f0; }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.7); border-color: rgba(148, 163, 184, 0.15); }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Surfaces */
        .dark .bg-white     { background-color: #1e293b; }
        .dark .bg-slate-50  { background-color: #243244; }
        .dark .bg-slate-100 { background-color: #334155; }
        .dark .bg-slate-200 { background-color: #3f4d63; }

        /* Hover surfaces */
        .dark .hover\:bg-white:hover     { background-color: #334155; }
        .dark .hover\:bg-slate-50:hover  { background-color: #334155; }
        .dark .hover\:bg-slate-100:hover { background-color: #3f4d63; }
        .dark .hover\:bg-slate-200:hover { background-color: #475569; }

        /* Text */
        .dark .text-slate-900, .dark .text-slate-800 { color: #e2e8f0; }
        .dark .text-slate-700, .dark .text-slate-600 { color: #cbd5e1; }
        .dark .text-slate-500 { color: #94a3b8; }
        .dark .text-slate-400 { color: #7c899c; }
        .dark .text-slate-300, .dark .text-slate-200 { color: #64748b; }

        /* Borders */
        .dark .border-slate-50, .dark .border-slate-100 { border-color: #2b3a4e; }
        .dark .border-slate-200, .dark .border-slate-400 { border-color: #3f4d63; }
        .dark .border-white { border-color: #334155; }
        .dark .divide-slate-100 > :not([hidden]) ~ :not([hidden]) { border-color: #2b3a4e; }

        /* Form controls */
        .dark input::placeholder, .dark textarea::placeholder { color: #64748b; }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a flash of light mode.
      try {
        var t = localStorage.getItem('eden-theme');
        if (t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.90.1",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
